<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gambling Ledger</title><style>
:root{--ink:#111c11;--surface:#203331;--surface2:#263d39;--line:#38524b;--text:#eafff9;--muted:#b4c9c1;--aqua:#8fe2dc;--teal:#32aaa3;--lime:#b6d400;--yellow:#fbff64;--loss:#ff7c8d}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:14px/1.4 Arial,sans-serif}.app{max-width:1420px;margin:auto;padding:28px 34px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.brand{font-size:34px;font-weight:900;letter-spacing:-1.4px;text-transform:uppercase}.brand span{color:var(--aqua)}.subtitle{color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase}.actions{display:flex;align-items:center;gap:14px}.sync-status{color:var(--muted);font-size:12px}.sync,button{font:inherit;cursor:pointer}.sync{border:0;border-radius:7px;padding:11px 16px;background:var(--aqua);color:#11231f;font-weight:800}.sync:disabled{opacity:.6;cursor:wait}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}.metric,.panel{background:var(--surface);border:1px solid #2b4540;border-radius:9px}.metric{padding:15px 16px;min-height:112px}.metric-label{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.metric-value{font-size:27px;font-weight:900;letter-spacing:-1px;margin:12px 0 2px}.metric-detail{color:var(--muted);font-size:12px}.positive{color:var(--yellow)}.negative{color:var(--loss)}.aqua{color:var(--aqua)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}.panel{padding:18px}.heading{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.heading h2{font-size:17px;margin:0}.heading p{margin:2px 0 0;color:var(--muted);font-size:12px}.note{color:var(--muted);font-size:12px}.chart{height:218px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:5px;padding:25px 5px 0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 52px,#324a4544 53px)}.bar{flex:1;min-width:5px;border-radius:3px 3px 0 0;background:linear-gradient(var(--aqua),var(--teal));position:relative}.bar.loss{background:var(--loss)}.bar:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#0c1512;padding:4px 6px;border-radius:4px;white-space:nowrap;color:var(--text);font-size:11px;z-index:2}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:8px 3px}.source-list{display:grid;gap:9px}.source-row{display:grid;grid-template-columns:96px 1fr 73px;gap:10px;align-items:center}.source-name{font-weight:700}.track{height:9px;border-radius:9px;background:#172724;overflow:hidden}.fill{height:100%;background:var(--aqua);border-radius:9px}.source-amount{text-align:right;font-weight:800}.calendar-panel{margin-top:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:11px;color:var(--muted);text-align:center;padding:3px}.day{height:74px;text-align:left;color:var(--text);padding:7px;border:1px solid #304943;background:#192a27;border-radius:6px}.day:hover,.day.active{border-color:var(--aqua);background:#29413c}.day.blank{visibility:hidden}.date{color:var(--muted);font-size:11px}.result{display:block;margin-top:15px;font-size:12px;font-weight:900}.count{font-size:10px;color:var(--muted)}.detail{margin-top:14px;padding:10px 12px;background:#172724;border-left:3px solid var(--aqua);border-radius:4px;color:var(--muted);font-size:12px}.error{border-left-color:var(--loss);color:#ffd4da}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:620px){.app{padding:18px}.brand{font-size:27px}header{align-items:start;flex-direction:column}.actions{width:100%;justify-content:space-between}.metrics{grid-template-columns:repeat(2,1fr)}.metric-value{font-size:22px}.day{height:57px;padding:5px}.result{margin-top:7px;font-size:10px}.calendar{gap:3px}}
</style></head><body><main class="app">
<header><div><div class="brand">Gambling <span>Ledger</span></div><div class="subtitle">Live daily performance dashboard</div></div><div class="actions"><span class="sync-status" id="status">Loading ledger…</span><button class="sync" id="sync">↻&nbsp; Sync sheet</button></div></header>
<section class="metrics" id="metrics"></section>
<section class="grid"><section class="panel"><div class="heading"><div><h2>Daily profit &amp; loss</h2><p>Most recent 30 ledger days</p></div><span class="note" id="range"></span></div><div class="chart" id="chart"></div><div class="axis"><span id="firstDate">—</span><span>Daily net</span><span id="lastDate">—</span></div></section><section class="panel"><div class="heading"><div><h2>Net by source</h2><p>All dated ledger entries</p></div></div><div class="source-list" id="sources"></div></section></section>
<section class="panel calendar-panel"><div class="heading"><div><h2>Daily performance</h2><p>Select a day to inspect its ledger result.</p></div><span class="note" id="calendarTitle"></span></div><div class="calendar" id="calendar"></div><div class="detail" id="detail">Select a date to view its ledger entries.</div></section>
</main><script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSjI8u_oOZsSLwxZSI_D2KQM-2iFurmPyTzGvPhkjkZoeu1lYvInLS8FQuYqaIdVN3vKQNIKnpZsBLn/pub?gid=1040433900&single=true&output=csv';
const SOURCE_COLUMNS=['DFS','Action','Pikkit','Juice Reel','Prediction','Bonus']; const state={rows:[],selected:null};
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v||0); const signed=v=>(v>=0?'+':'−')+money(Math.abs(v||0));
function parseCSV(text){const out=[];let row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){field+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(field);if(row.some(x=>x!==''))out.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x!==''))out.push(row);const headers=out.shift().map(x=>x.trim());return out.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])))}
function number(v){const n=Number(String(v||'').replace(/[$,%\s,]/g,''));return Number.isFinite(n)?n:0}function toDate(v){const [m,d,y]=String(v).split('/').map(Number);return new Date(y<100?2000+y:y,m-1,d)}
function normalize(data){return data.filter(r=>r.Date).map(r=>{const balanceKey=Object.keys(r).find(k=>k.startsWith('Balance'));return {...r,date:toDate(r.Date),total:number(r.Total),ytd:number(r.YTD),balance:number(balanceKey?r[balanceKey]:0),percent:number(r['Percent Gain'])}}).filter(r=>!Number.isNaN(r.date)).sort((a,b)=>a.date-b.date)}
function render(){const rows=state.rows,latest=rows.at(-1),wins=rows.filter(r=>r.total>0),settled=rows.filter(r=>r.total!==0),net=latest.ytd||rows.reduce((s,r)=>s+r.total,0),winRate=wins.length/(settled.length||1);metrics.innerHTML=[['Net profit',signed(net),net>=0?'positive':'negative','Latest YTD ledger total'],['Return',`${latest.percent>=0?'+':''}${latest.percent.toFixed(2)}%`,latest.percent>=0?'positive':'negative','Latest percent gain'],['Current balance',money(latest.balance),'aqua','Latest recorded balance'],['Winning days',`${(winRate*100).toFixed(1)}%`,'',`${wins.length} of ${settled.length} recorded days`],['Open exposure','—','aqua','Add an exposure column to track this']].map(x=>`<div class="metric"><div class="metric-label">${x[0]}</div><div class="metric-value ${x[2]}">${x[1]}</div><div class="metric-detail">${x[3]}</div></div>`).join('');const recent=rows.slice(-30),max=Math.max(...recent.map(r=>Math.abs(r.total)),1);chart.innerHTML=recent.map(r=>`<i class="bar ${r.total<0?'loss':''}" style="height:${Math.max(5,Math.abs(r.total)/max*100)}%" data-tip="${r.Date}: ${signed(r.total)}"></i>`).join('');firstDate.textContent=recent[0].Date;lastDate.textContent=latest.Date;range.textContent=`${recent.length} days loaded`;const totals=Object.fromEntries(SOURCE_COLUMNS.map(c=>[c,rows.reduce((s,r)=>s+number(r[c]),0)])),maxSource=Math.max(...Object.values(totals).map(x=>Math.abs(x)),1);sources.innerHTML=SOURCE_COLUMNS.map(c=>`<div class="source-row"><span class="source-name">${c}</span><div class="track"><div class="fill" style="width:${Math.abs(totals[c])/maxSource*100}%;background:${totals[c]<0?'var(--loss)':'var(--aqua)'}"></div></div><span class="source-amount ${totals[c]<0?'negative':'positive'}">${signed(totals[c])}</span></div>`).join('');renderCalendar(latest.date.getFullYear(),latest.date.getMonth())}
function renderCalendar(year,month){const start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),daily=new Map(state.rows.filter(r=>r.date.getFullYear()===year&&r.date.getMonth()===month).map(r=>[r.date.getDate(),r]));calendarTitle.textContent=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(year,month,1));calendar.innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<start;i++)calendar.innerHTML+='<button class="day blank"></button>';for(let d=1;d<=days;d++){const r=daily.get(d);calendar.innerHTML+=`<button class="day ${state.selected===d?'active':''}" data-day="${d}"><span class="date">${d}</span>${r?`<span class="result ${r.total>=0?'positive':'negative'}">${signed(r.total)}</span><span class="count">${r.Date}</span>`:''}</button>`}calendar.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.day);const r=daily.get(state.selected);detail.innerHTML=r?`<strong>${r.Date}</strong> · Net: <span class="${r.total>=0?'positive':'negative'}">${signed(r.total)}</span> · YTD: ${money(r.ytd)} · Balance: ${money(r.balance)}`:`<strong>${month+1}/${state.selected}/${year}</strong> · No ledger entry.`;renderCalendar(year,month)})}
async function sync(){syncButton.disabled=true;syncButton.textContent='Syncing…';status.textContent='Downloading latest Sheet data…';try{const response=await fetch(CSV_URL,{cache:'no-store'});if(!response.ok)throw new Error(`Sheet returned ${response.status}`);state.rows=normalize(parseCSV(await response.text()));if(!state.rows.length)throw new Error('No dated records found');state.selected=null;render();status.textContent=`Synced ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${state.rows.length} ledger days`;detail.classList.remove('error')}catch(error){status.textContent='Could not sync';detail.classList.add('error');detail.textContent=`Sync error: ${error.message}. Confirm the Sheet remains published as CSV, then try again.`}finally{syncButton.disabled=false;syncButton.textContent='↻  Sync sheet'}}
const syncButton=document.getElementById('sync'),metrics=document.getElementById('metrics'),chart=document.getElementById('chart'),sources=document.getElementById('sources'),calendar=document.getElementById('calendar'),detail=document.getElementById('detail'),status=document.getElementById('status'),firstDate=document.getElementById('firstDate'),lastDate=document.getElementById('lastDate'),range=document.getElementById('range'),calendarTitle=document.getElementById('calendarTitle');syncButton.onclick=sync;sync();setInterval(sync,15*60*1000);
</script></body></html>
